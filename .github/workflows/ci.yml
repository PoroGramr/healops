name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './backend[test]' -e './worker[test]' -e './executor'
      - run: ruff check backend/app backend/alembic worker/healops_worker executor/healops_executor examples/broken-app --select E,F
      - run: pytest -q backend/tests worker/tests executor/tests
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose -f deploy/docker-compose.yml config --quiet
      - run: cp .env.example .env.monitor && docker compose -f deploy/compose.monitor.yml config --quiet
      - run: docker compose -f deploy/compose.monitor.yml -f deploy/compose.repair.yml config --quiet
      - run: cp .env.example .env.auto-demo && docker compose -f deploy/compose.auto-demo.yml config --quiet
